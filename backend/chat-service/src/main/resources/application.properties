spring.application.name=chat-service

# Core WebSocket/Messaging Debug Logging (Keep at TRACE)
logging.level.org.springframework.messaging=DEBUG
logging.level.org.springframework.web.socket=DEBUG

# Specific Handler Logging (Keep at TRACE)
logging.level.org.springframework.messaging.simp.annotation.support.SimpAnnotationMethodMessageHandler=TRACE
logging.level.org.springframework.messaging.simp.broker.SimpleBrokerMessageHandler=TRACE
logging.level.org.springframework.messaging.simp.user.UserDestinationMessageHandler=TRACE
logging.level.org.springframework.messaging.simp.stomp.StompBrokerRelayMessageHandler=TRACE

# Channel Logging (NEW - Set to TRACE)
logging.level.org.springframework.messaging.simp.broker=TRACE
logging.level.org.springframework.messaging.support.ExecutorSubscribableChannel=TRACE
logging.level.org.springframework.messaging.support.ExecutorChannelInterceptor=TRACE

# Message Conversion and Handler Resolution (Keep at TRACE)
logging.level.org.springframework.messaging.converter=TRACE
logging.level.org.springframework.messaging.handler=TRACE

# Jackson (Keep at TRACE, can be verbose)
logging.level.com.fasterxml.jackson.databind=TRACE

# Tomcat WebSocket (Keep commented unless needed)
# logging.level.org.apache.tomcat.websocket=TRACE

# Keep TRACE for our specific interceptor and controller
logging.level.com.streamingapp.chatservice.config.LoggingChannelInterceptor=TRACE
logging.level.com.streamingapp.chatservice.controller.ChatController=INFO
